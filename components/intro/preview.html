<div class="intro-stage"><div class="wm"><span class="gold l-j">J</span><span class="gold x x-avor">AVOR</span><span class="gold x x-dash">-</span><span class="gold l-s">S</span><span class="gold x x-ped">PED</span></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script>
var introTl;
function playIntro(){
  if(introTl) introTl.kill();
  var q=function(s){return document.querySelector(s)}, prog=q('.ring .prog'), len=2*Math.PI*72, count=q('.count'), c={v:0};
  gsap.set('.intro,.intro-bg,.ring,.count,.wm,.l-j,.l-s,.logo-mark',{clearProps:'all'});
  gsap.set('.x',{width:0,opacity:0,paddingLeft:0,paddingRight:0}); gsap.set('.hero-copy',{opacity:0});
  gsap.set(prog,{strokeDasharray:len,strokeDashoffset:len});
  gsap.set(['.l-j','.l-s'],{yPercent:60,opacity:0});
  gsap.set('.logo-mark',{opacity:0,scale:.92,transformOrigin:'50% 50%'});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){gsap.set('.intro',{display:'none'});gsap.set('.hero-copy',{opacity:1});return;}
  introTl=gsap.timeline();
  introTl
    /* 1 · the logo loads inside the ring */
    .to('.logo-mark',{opacity:1,scale:1,duration:.8,ease:'power3.out'},.15)
    .to(prog,{strokeDashoffset:0,duration:1.8,ease:'power1.inOut'},.2)
    .to(c,{v:100,duration:1.8,ease:'power1.inOut',onUpdate:function(){count.textContent=String(Math.round(c.v)).padStart(3,'0');}},.2)
    .to('.count',{opacity:0,duration:.4},2.0)
    .to('.logo-mark',{opacity:0,scale:.94,duration:.45,ease:'power2.in'},2.05)
    /* 2 · JS rises into the ring */
    .to('.l-j',{yPercent:0,opacity:1,duration:.65,ease:'power3.out'},2.45)
    .to('.l-s',{yPercent:0,opacity:1,duration:.65,ease:'power3.out'},2.6)
    .to('.ring',{opacity:0,scale:1.12,duration:.5,ease:'power2.in',transformOrigin:'50% 50%'},3.35)
    /* 3 · JS → JAVOR */
    .to('.l-s',{width:0,opacity:0,duration:.6,ease:'power3.inOut'},3.6)
    .to('.x-avor',{width:'auto',opacity:1,duration:.9,ease:'power3.inOut'},3.6)
    /* 4 · JAVOR → JAVOR-SPED */
    .to('.x-dash',{width:'auto',opacity:1,duration:.5,ease:'power3.inOut',paddingLeft:'.1em',paddingRight:'.1em'},4.7)
    .to('.l-s',{width:'auto',opacity:1,duration:.6,ease:'power3.inOut'},4.8)
    .to('.x-ped',{width:'auto',opacity:1,duration:.8,ease:'power3.inOut'},4.9)
    /* 5 · fade into the hero */
    .to('.wm',{opacity:0,y:-18,duration:.6,ease:'power2.in'},6.0)
    .to('.intro-bg',{opacity:0,duration:1.2,ease:'power2.inOut'},6.3)
    .to('.hero-copy',{opacity:1,duration:1,ease:'power2.out'},7.0);
}
